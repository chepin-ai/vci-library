name: llm-bench
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [llm-bench]
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 真联测 R3
        env:
          DS: ${{ secrets.DEEPSEEK_API_KEY }}
          KM: ${{ secrets.KIMI_API_KEY }}
          LC: ${{ secrets.LONGCAT_API_KEY }}
        run: python3 llm-bench/bench.py
      - name: 回写
        run: |
          git config user.name "llm-bench"
          git config user.email "bench@ci-bus.local"
          git add -A llm-bench/
          git commit -qm "bench R3 $(date -u +%H:%M:%SZ) [skip ci]" || echo nothing
          git push -q
